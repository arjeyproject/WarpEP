[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warpep"
version = "1.0.0"
description = "WarpEP by ArJey - a real Cloudflare WARP endpoint scanner with zero dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ArJey" }]
keywords = ["cloudflare", "warp", "wireguard", "scanner", "endpoint", "vpn", "noise", "termux"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet",
  "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/arjeyproject/WarpEP"
Source = "https://github.com/arjeyproject/WarpEP"
Issues = "https://github.com/arjeyproject/WarpEP/issues"

[project.scripts]
warpep = "warpep.cli:main"

[tool.setuptools]
packages = ["warpep", "warpep.wireguard"]

[tool.setuptools.package-data]
warpep = ["py.typed"]
