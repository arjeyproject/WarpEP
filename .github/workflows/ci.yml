name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.10", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every module
        run: python -m compileall -q warpep
      - name: Unit and integration tests
        working-directory: tests
        run: python -m unittest discover -s . -t .. -v
      - name: Selftest (crypto vectors + scan loop)
        run: python -m warpep selftest
      - name: CLI smoke test
        run: |
          python -m warpep version
          python -m warpep config 162.159.192.1:2408 --no-register
      - name: Build the single-file bundle
        run: |
          python scripts/build_bundle.py
          python warpep.pyz version

  package:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: warpep-dist
          path: dist/*
